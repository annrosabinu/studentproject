<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studentreg</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <style>
        @media(min-width:320px){
            body{
                background-repeat: no-repeat;
                background-size: cover;
                height:100vh;
            }
            .container{
                margin: auto;
                background-color: white;
                width: 400px;
                height: 570px;
                margin-top: 20px; 
            }
            input[type=text], input[type=email], input[type=date], input[type=radio]{
                margin-left: 40px;
                margin-top: 10px;
            }
            label{
                margin-top: 10px;
            }
            textarea{
                margin-left: 40px;
                margin-top: 10px;
            }
            select{
                margin-left: 40px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body style="background-image: url('{% static "images/regbg.jpg" %}');">
    <div class="container">
        <h1 class="text-danger ml-2 mt-5 text-center">Student Registration</h1>
        <form action="{% url 'studentdetails' %}" method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <td><label>Student Name</label></td>
                    <td><input type="text" name="sname"></td>
                </tr>
                <tr>
                    <td><label>Address</label></td>
                    <td><textarea name="address" rows="3" cols="20"></textarea></td>
                </tr>
                <tr>
                    <td><label>Age</label></td>
                    <td><input type="text" name="age"></td>
                </tr>
                <tr>
                    <td><label>Email Address</label></td>
                    <td><input type="email" name="email"></td>
                </tr>
                <tr>
                    <td><label>Joining Date</label></td>
                    <td><input type="date" name="date"></td>
                </tr>
                <tr>
                    <td><label>Qualification</label></td>
                    <td>
                        <select name='qualification'>
                            <option>Select an option</option>
                            <option value="SSLC">SSLC</option>
                            <option value="PLUSTWO">PLUSTWO</option>
                            <option value="DIPLOMA">DIPLOMA</option>
                            <option value="DEGREE">DEGREE</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label>Gender</label></td>
                    <td><input type="radio" name="gender" value="Male">Male<br><br><input type="radio" name="gender" value="Female">Female</td>
                </tr>
                <tr>
                    <td><label>Mobile No</label></td>
                    <td><input type="text" name="contact"></td>
                </tr>
            </table>


            <button type="submit" value="submit" style="margin-top: 30px;margin-left: 150px;background-color: blue;color: rgb(126, 128, 0);" >Register</button>
        </form>
    </div>
</body>
</html>
