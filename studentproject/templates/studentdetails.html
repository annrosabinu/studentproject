<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <style>
        @media(min-width:358px){
            body{
                background-repeat: no-repeat;
                background-size: cover;
                height:100vh;
            }
        }
    </style>
</head>
<body style="background-image: url('{% static "images/bgstudentdetails.jpg" %}');">
    <h1 class="text-center text-success mt-5"> Student Details</h1>
    <div class="container">
    <div class="table-responsive">
    <table class="table table-bordered mt-3 table-success table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email Address</th>
                <th>Contact</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for s in student %}
            <tr>
                <td><a href="{% url 'viewpage' s.id %}">{{s.Name}}</a></td>
                <td>{{s.email}}</td>
                <td>{{s.mobileno}}</td>
                <td><a href="{% url 'editdetails' s.id %}" class="bg-primary text-light">Edit</a><a href="{% url 'deletepage' s.id %}" class="bg-danger text-light ml-2">Delete</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
    </div>
</body>
</html>
