<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <style>
        @media(min-width:350px){
            .card{
                margin: auto;
                margin-top: 50px;
                width:400px;
                height:400px;
            }
            label{
                padding-top: 10px;
            }
        }
    </style>
</head>
<body style="background-color: rgb(172, 99, 36)">
    <div class="card">
        <div class="card-body">
          <center><h5 class="card-title text-success">Details Of {{details.Name}}</h5></center>
          <table>
            <tr>
                <td><label>Address:</label></td>
                <td style="padding-left: 10px;"><label>{{details.address}}</label></td>
            </tr>
            <tr>
                <td><label>Age:</label></td>
                <td style="padding-left: 10px;"><label>{{details.age}}</label></td>
            </tr>
            <tr>
                <td><label>Email Id:</label></td>
                <td style="padding-left: 10px;"><label>{{details.email}}</label></td>
            </tr>
            <tr>
                <td><label>Joining Date:</label></td>
                <td style="padding-left: 10px;"><label>{{details.joinIngdate}}</label></td>
            </tr>
            <tr>
                <td><label>Qualification:</label></td>
                <td style="padding-left: 10px;"><label>{{details.qualification}}</label></td>
            </tr>
            <tr>
                <td><label>Gender:</label></td>
                <td style="padding-left: 10px;"><label>{{details.gender}}</label></td>
            </tr>
            <tr>
                <td><label>Contact No:</label></td>
                <td style="padding-left: 10px;"><label>{{details.mobileno}}</label></td>
            </tr>
          </table>
          <a href="{% url 'showstudentdetails' %}" class="card-link">Go Back</a>
        </div>
    </div>
</body>
</html>
